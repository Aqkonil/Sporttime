const defaultLogo="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg";
function teamBalanceScore(teams) {
        const ratingQuarterSums = teams.map(team =>
            team.reduce((sum, p) => sum + Math.round(p.rating * 4), 0)
        );

        const totalRatingQuarter = ratingQuarterSums.reduce((a, b) => a + b, 0);
        const targetRatingQuarter = totalRatingQuarter / teams.length;

        const ratingAbs = ratingQuarterSums.reduce(
            (sum, value) => sum + Math.abs(value - targetRatingQuarter), 0
        );

        const ratingVar = ratingQuarterSums.reduce(
            (sum, value) => sum + Math.pow(value - targetRatingQuarter, 2), 0
        );

        return ratingAbs * 1000000 + ratingVar * 10000;
    }
function distributeEquallyFlexible(players, numTeams) {
        if (!players.length || numTeams < 2 || players.length < numTeams) return null;

        const tierCount = Math.ceil(players.length / numTeams);
        const compact = slots => slots.map(row => row.filter(Boolean));
        const sumRating = row => row.reduce((t, p) => t + (p ? p.rating : 0), 0);

        let bestTeams = null;
        let bestScore = Infinity;

        for (let restart = 0; restart < 150; restart++) {
            // strongest first; equal players are mixed randomly (the first try has no randomness)
            const order = [...players];
            if (restart > 0) order.sort(() => Math.random() - 0.5);
            order.sort((a, b) => (b.rating - a.rating));

            // slots[team][tier] = player
            const slots = Array.from({ length: numTeams }, () => new Array(tierCount).fill(null));

            for (let k = 0; k < tierCount; k++) {
                const tier = order.slice(k * numTeams, (k + 1) * numTeams);
                // teams with the lowest total so far get the strongest player of this group
                let teamOrder = Array.from({ length: numTeams }, (_, i) => i);
                if (restart > 0) teamOrder.sort(() => Math.random() - 0.5);
                teamOrder.sort((x, y) => sumRating(slots[x]) - sumRating(slots[y]));
                tier.forEach((p, i) => { slots[teamOrder[i]][k] = p; });
            }

            // improve the balance only by swapping players of the SAME group between two teams
            let currentScore = teamBalanceScore(compact(slots));
            let improved = true;
            while (improved) {
                improved = false;
                let bestSwap = null;
                let bestSwapScore = currentScore;

                for (let k = 0; k < tierCount; k++) {
                    for (let a = 0; a < numTeams; a++) {
                        for (let b = a + 1; b < numTeams; b++) {
                            if (!slots[a][k] || !slots[b][k]) continue;
                            const tmp = slots[a][k]; slots[a][k] = slots[b][k]; slots[b][k] = tmp;
                            const score = teamBalanceScore(compact(slots));
                            if (score < bestSwapScore - 1e-9) { bestSwapScore = score; bestSwap = [k, a, b]; }
                            slots[b][k] = slots[a][k]; slots[a][k] = tmp;
                        }
                    }
                }

                if (bestSwap) {
                    const [k, a, b] = bestSwap;
                    const tmp = slots[a][k]; slots[a][k] = slots[b][k]; slots[b][k] = tmp;
                    currentScore = bestSwapScore;
                    improved = true;
                }
            }

            if (currentScore < bestScore) {
                bestScore = currentScore;
                bestTeams = compact(slots);
            }
        }

        return bestTeams;
    }
function buildBaseCycleSchedule(teams) {
        let teamIds = teams.map(t => t.id);

        if (teamIds.length % 2 !== 0) teamIds.push(null);

        let numTeams = teamIds.length;
        let numRounds = numTeams - 1;
        let schedule = [];

        for (let round = 0; round < numRounds; round++) {
            let roundMatches = [];

            for (let i = 0; i < numTeams / 2; i++) {
                let home = teamIds[i];
                let away = teamIds[numTeams - 1 - i];

                if (home !== null && away !== null) {
                    roundMatches.push({
                        t1: home,
                        t2: away
                    });
                }
            }

            schedule.push(roundMatches);
            teamIds.splice(1, 0, teamIds.pop());
        }

        return schedule;
    }

let tab = "players", mode = "country", viewRound = 1, selected = new Set(), playersData = [], state = null, curGroup = null;

async function groupView(id) {
  const g = groups.find(x => x.id === id);

const teamName = t => `<span class="tm"><img class="tlogo" src="${esc(t.logo || defaultLogo)}" alt="" onerror="this.src='${defaultLogo}'">${esc(t.name)}</span>`;

function matchesTab(isAdmin) {
  const teams = state.teams || [], matches = state.matches || [];
  if (!teams.length) return `<p class="empty">No tournament yet. ${isAdmin ? "Select players and press Start Tournament." : ""}</p>`;
  const rounds = Math.max(1, Number(state.total_rounds) || 1);
  viewRound = Math.min(Math.max(viewRound, 1), rounds);
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const tcards = teams.map(t => `<div class="player-card"><div class="player-row"><b>${teamName(t)}</b>
    <span class="player-rating">${t.players.reduce((s, p) => s + p.rating, 0)}</span></div>
    <div class="roster">${t.players.map(p => `<span class="chip">${esc(p.name)}</span>`).join("")}</div></div>`).join("");
  const ml = matches.filter(m => m.tour === viewRound).map(m => `<div class="player-card match">${teamName(byId[m.t1])}<span class="vs">${m.played ? m.s1 + " : " + m.s2 : "vs"}</span>${teamName(byId[m.t2])}</div>`).join("");
  return `<div class="section-header"><span class="section-title">⚙️ Teams</span></div><div class="player-grid">${tcards}</div>
    <div class="section-header" style="margin-top:22px"><span class="section-title">📅 Match schedule</span></div>

    <div class="stack">${ml}</div>`;
}

    <button class="btn btn-blue btn-sm" onclick="saveRating('${p.id}')">Save rating</button>

    <button class="btn btn-dark btn-sm" style="color:var(--primary-red)" onclick="removePlayer('${p.id}')">Delete player</button></div></div>`;

    <div class="panel" style="margin-bottom:16px"><div class="add-row"><input id="newName" placeholder="Player name"><input id="newRating" type="number" step="0.25" min="0" placeholder="Rating"></div><button class="btn btn-green" onclick="addPlayer('${g.id}')">＋ Add player</button></div>
    ${playersData.length ? `<div class="player-grid">${playersData.map(card).join("")}</div>` : `<p class="empty">No players yet. Add the first one above.</p>`}`;
}

window.setTab = t => { tab = t; route(); };
window.setMode = m => { mode = m; route(); };
window.toggleSel = (pid, on) => { on ? selected.add(pid) : selected.delete(pid); const t = document.querySelector(".section-title"); if (t) t.textContent = `Squad (${selected.size} selected)`; };
window.selectAll = () => { selected = selected.size === playersData.length ? new Set() : new Set(playersData.map(p => p.id)); route(); };
window.moveRound = d => { viewRound += d; route(); };
window.startTournament = async () => {
  const sel = playersData.filter(p => selected.has(p.id));
  if (sel.length < 4) return alert("Select at least 4 players.");
  if ((state.teams || []).length && !confirm("A tournament is already running. Start a new one? The current teams and matches will be replaced.")) return;
  const n = sel.length > 15 ? 4 : sel.length > 11 ? 3 : 2;
  const dist = distributeEquallyFlexible(sel, n);
  if (!dist) return alert("Could not create equal teams. Check the selected players.");
  const presets = clubPresets.filter(p => p.type === mode).sort(() => Math.random() - .5).slice(0, n);
  const teams = dist.map((pl, i) => {
    const pr = presets[i] || { name: `Team ${i + 1}`, code: "t" + (i + 1), logo: defaultLogo };
    return { id: i + 1, name: pr.name, type: mode, code: pr.code, logo: pr.logo,
      players: pl.map(p => ({ id: p.id, name: p.name, rating: p.rating, avatar_url: p.avatar_url })),
      played: 0, win: 0, draw: 0, loss: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
  });
  const matches = buildBaseCycleSchedule(teams)[0].map((m, i) => ({ id: i + 1, matchNumber: i + 1, tour: 1, t1: m.t1, t2: m.t2, s1: null, s2: null, played: false, goalsDetails: [], mvpId: null }));
  const { error } = await db.from("tournament_state").update({ teams, matches, current_round: 1, total_rounds: 1, updated_at: new Date().toISOString() }).eq("group_id", curGroup);
  if (error) return alert("Could not start the tournament.");
  tab = "matches"; viewRound = 1; route();
};

window.go = h => { location.hash = h; if (location.hash.slice(1) === h) route(); };
window.signOut = async () => { await db.auth.signOut(); adminGroup = null; route(); };

async function route() {

  const b = document.getElementById("themeBtn"); if (b) b.textContent = t === "dark" ? "☀️" : "🌙";
}
window.toggleTheme = () => setTheme(document.body.getAttribute("data-theme") === "dark" ? "light" : "dark");

}

function landing() {
  headerActions();
  const opt = g => `<option value="${g.id}">${esc(g.name)}</option>`;
  app.innerHTML = `<div class="section-header"><span class="section-title">Choose your class or group</span></div>

    </select></div>`;
  document.getElementById("sel").onchange = e => { if (e.target.value) location.hash = e.target.value; };
}

function loginView(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return go("");
  headerActions(`<button class="admin-btn" onclick="go('${g.id}')">Back</button>`);
  app.innerHTML = `<div class="section-header"><span class="section-title">${esc(g.name)} admin</span></div>
    <div class="panel stack">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <p class="msg" id="msg"></p>
      <button class="btn btn-blue" id="go">Sign in</button>
    </div>`;
  const submit = async () => {
    const msg = document.getElementById("msg"); msg.textContent = "";
    await db.auth.signOut();
    const { error } = await db.auth.signInWithPassword({ email: loginEmail(id), password: document.getElementById("pw").value });
    if (error) { msg.textContent = "Wrong password."; return; }
    await loadAdmin();
    if (adminGroup !== id) { await db.auth.signOut(); adminGroup = null; msg.textContent = "This account has no access."; return; }
    go(id);
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") submit(); };
}

async function groupView(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return go("");
  const isAdmin = adminGroup === id;
  headerActions(`<button class="admin-btn" onclick="go('')">Change group</button>` +
    (isAdmin ? `<button class="admin-btn" onclick="signOut()">Sign out</button>` : `<button class="admin-btn" onclick="go('login-${g.id}')">🔐 Admin</button>`));
  const { data: players, error } = await db.from("players").select("*").eq("group_id", id).order("rating", { ascending: false }).order("name");

    ${error ? `<p class="msg">Could not load players. Check the connection and refresh.</p>` : ""}
    ${players && players.length ? `<div class="player-grid">${players.map(card).join("")}</div>` : `<p class="empty">${isAdmin ? "No players yet. Add the first one above." : "No players yet."}</p>`}`;
}

  const url = db.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
