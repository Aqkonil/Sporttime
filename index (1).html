<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aqtobe BIL Sport Time</title>
<link rel="icon" href="logo.webp">
<style>
:root{--navy:#14183f;--tan:#c9b18a;--bg:#f7f5f0;--card:#fff;--ink:#14183f;--sub:#6a6e85;--line:#e3dfd3;--btn:#14183f;--btn-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d1030;--card:#171b47;--ink:#f3efe6;--sub:#a4a8c4;--line:#2b3066;--btn:#c9b18a;--btn-ink:#14183f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.logo{width:120px;height:120px;border-radius:50%}
h1{margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:-.01em}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.center select,.center input{width:min(340px,100%)}
button{font:inherit;font-weight:600;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.danger{background:none;color:#c0392b;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top img{width:44px;height:44px;border-radius:50%}
.top h2{margin:0;font-size:22px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;object-fit:cover;background:var(--tan);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700}
.name{font-weight:600}
.rating{color:var(--sub);font-size:14px}
.admin{display:grid;gap:8px;margin-top:12px}
.admin input{padding:8px 10px;width:100%}
.admin button{padding:8px 10px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.bar input[name=n]{flex:1;min-width:160px}
.bar input[name=r]{width:110px}
.msg{color:#c0392b;min-height:1.4em;margin:0}
.empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Public project values (safe in the browser). Never put a secret/service_role key here.
const SUPABASE_URL = "https://wxcjkksctzfkwjoryhja.supabase.co";
const SUPABASE_KEY = "sb_publishable_8b2me5PiBhOOIaVFtBaB_Q_BIO_Oc7J";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
let groups = [], adminGroup = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const loginEmail = id => id.toLowerCase() + "@aqtobebil.app";

async function loadAdmin() {
  const { data: { session } } = await db.auth.getSession();
  adminGroup = null;
  if (!session) return;
  const { data } = await db.from("group_admins").select("group_id").maybeSingle();
  adminGroup = data ? data.group_id : null;
}

function landing() {
  const opt = g => `<option value="${g.id}">${esc(g.name)}</option>`;
  app.innerHTML = `<main class="center">
    <img class="logo" src="logo.webp" alt="">
    <h1>Aqtobe BIL Sport Time</h1>
    <select id="sel" aria-label="Class or group">
      <option value="">Select your class or group</option>
      <optgroup label="Classes">${groups.filter(g => g.kind === "class").map(opt).join("")}</optgroup>
      <optgroup label="Staff">${groups.filter(g => g.kind !== "class").map(opt).join("")}</optgroup>
    </select></main>`;
  document.getElementById("sel").onchange = e => { if (e.target.value) location.hash = e.target.value; };
}

function loginView(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return go("");
  app.innerHTML = `<main class="center">
    <img class="logo" src="logo.webp" alt="">
    <h1>${esc(g.name)} admin</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <p class="msg" id="msg"></p>
    <button id="go">Sign in</button>
    <button class="ghost" onclick="go('${g.id}')">Back</button></main>`;
  const submit = async () => {
    const msg = document.getElementById("msg"); msg.textContent = "";
    await db.auth.signOut();
    const { error } = await db.auth.signInWithPassword({ email: loginEmail(id), password: document.getElementById("pw").value });
    if (error) { msg.textContent = "Wrong password."; return; }
    await loadAdmin();
    if (adminGroup !== id) { await db.auth.signOut(); adminGroup = null; msg.textContent = "This account has no access."; return; }
    go(id);
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") submit(); };
}

async function groupView(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return go("");
  const { data: players, error } = await db.from("players").select("*").eq("group_id", id).order("rating", { ascending: false }).order("name");
  const isAdmin = adminGroup === id;
  const card = p => `<div class="card">
    ${p.avatar_url ? `<img class="av" src="${esc(p.avatar_url)}" alt="">` : `<div class="av">${esc(p.name.trim().charAt(0).toUpperCase())}</div>`}
    <div class="name">${esc(p.name)}</div>
    <div class="rating">Rating ${Number(p.rating)}</div>
    ${isAdmin ? `<div class="admin">
      <input type="number" step="0.25" min="0" id="r_${p.id}" value="${Number(p.rating)}" aria-label="Rating">
      <button onclick="saveRating('${p.id}')">Save rating</button>
      <input type="file" accept="image/*" id="f_${p.id}" onchange="uploadPhoto('${p.id}')" aria-label="Photo">
      <button class="danger" onclick="removePlayer('${p.id}')">Delete</button></div>` : ""}</div>`;
  app.innerHTML = `<div class="wrap">
    <div class="top"><img src="logo.webp" alt=""><h2>${esc(g.name)}</h2>
      <button class="ghost" onclick="go('')">Change group</button>
      ${isAdmin ? `<button class="ghost" onclick="signOut()">Sign out</button>` : `<button class="ghost" onclick="go('login-${g.id}')">Admin</button>`}</div>
    ${isAdmin ? `<div class="bar"><input name="n" id="newName" placeholder="Player name"><input name="r" id="newRating" type="number" step="0.25" min="0" placeholder="Rating"><button onclick="addPlayer('${g.id}')">Add player</button></div>` : ""}
    ${error ? `<p class="msg">Could not load players. Check the connection and refresh.</p>` : ""}
    ${players && players.length ? `<div class="grid">${players.map(card).join("")}</div>` : `<p class="empty">${isAdmin ? "No players yet. Add the first one above." : "No players yet."}</p>`}
  </div>`;
}

window.go = h => { location.hash = h; if (location.hash.slice(1) === h) route(); };
window.signOut = async () => { await db.auth.signOut(); adminGroup = null; route(); };
window.addPlayer = async gid => {
  const name = document.getElementById("newName").value.trim();
  const rating = Number(document.getElementById("newRating").value) || 0;
  if (!name) return alert("Enter the player's name.");
  const { error } = await db.from("players").insert({ group_id: gid, name, rating, start_rating: rating });
  if (error) return alert("Could not add the player.");
  route();
};
window.saveRating = async pid => {
  const rating = Number(document.getElementById("r_" + pid).value);
  const { error } = await db.from("players").update({ rating }).eq("id", pid);
  if (error) return alert("Could not save the rating.");
  route();
};
window.removePlayer = async pid => {
  if (!confirm("Delete this player?")) return;
  const { error } = await db.from("players").delete().eq("id", pid);
  if (error) return alert("Could not delete the player.");
  route();
};
window.uploadPhoto = async pid => {
  const file = document.getElementById("f_" + pid).files[0];
  if (!file) return;
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${adminGroup}/${pid}.${ext}`;
  const up = await db.storage.from("avatars").upload(path, file, { upsert: true, contentType: file.type });
  if (up.error) return alert("Could not upload the photo.");
  const url = db.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
  const { error } = await db.from("players").update({ avatar_url: url }).eq("id", pid);
  if (error) return alert("Could not save the photo.");
  route();
};

async function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return landing();
  if (h.startsWith("login-")) return loginView(h.slice(6));
  return groupView(h);
}

(async () => {
  const { data } = await db.from("groups").select("*").order("sort");
  groups = data || [];
  await loadAdmin();
  route();
  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
